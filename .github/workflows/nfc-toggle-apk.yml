name: Build NFC Toggle APK

on:
  push:
    paths:
      - "nfc-toggle-android/**"
      - ".github/workflows/nfc-toggle-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfc-toggle-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nfc-toggle-apk
          path: nfc-toggle-android/app/build/outputs/apk/release/*.apk
