name: GitHub Pages に公開する

on:
  push:
    branches:
      - claude/app-development-6tvlrg
      - claude/productivity-app-development-7fx3eh
  workflow_dispatch:

# このリポジトリの Pages は gh-pages ブランチから配信する設定なので、
# 組み上げたものをそのブランチへ押し込む
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Pages は /<リポジトリ名>/ の下で配信されるので、そこを基準にする
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
